services:
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: 'db'
      # Você não precisa usar root, mas pode se quiser.
      MYSQL_USER: 'user'
      # Use a senha que preferir.
      MYSQL_PASSWORD: 'password'
      # Senha de acesso do root.
      MYSQL_ROOT_PASSWORD: 'root'
    ports:
      - '3306:3306'
    volumes:
      # Onde os dados do banco ficam persistidos.
      - my-db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: on-failure
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: db
      PORT: 8081
    ports:
      - '8081:8081'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./client
    restart: on-failure
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  my-db:
